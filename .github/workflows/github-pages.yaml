name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main

# Supply-chain baseline (2026-10-20): no token scope at the top; the job asks for contents: write because the deploy pushes
# the built site to gh-pages with GITHUB_TOKEN and the repository default is read-only (homelab-governance SC-11, 2026-10-18).
# Every action is pinned to a full commit SHA with its exact tag as a comment; the checkout keeps no token (jekyll-action
# pushes with the token it is given, not with .git/config).
# NOTE: this workflow cannot succeed as it stands. actions/cache v2 is refused by GitHub (cache v1/v2 were retired in 2025),
# and the repository has no Gemfile or _config.yml for jekyll-action to build; the site (docs/) is deployed by
# jekyll-gh-pages.yml.
permissions: {}

jobs:
  github-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write # jekyll-action pushes the built site to gh-pages
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - uses: helaili/jekyll-action@38e2fb5cb2754159cc40b39c2baf72c6eb4e0042 # 2.0.5
        env:
          JEKYLL_PAT: ${{ secrets.GITHUB_TOKEN }}
